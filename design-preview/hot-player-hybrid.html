<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MY IPTV | Live TV</title>
<style>
:root{font-family:Inter,Arial,sans-serif;color:#f4f7ff;background:#101d35;--yellow:#ffe332;--panel:#243e67;--panel2:#1b3053}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}.shell{height:100vh;min-height:500px;display:flex;flex-direction:column;background:linear-gradient(130deg,#0d1930,#254b7c)}header{height:66px;display:flex;align-items:center;gap:24px;padding:0 20px;background:#152846;border-bottom:1px solid #58759b}.brand{font-size:25px;font-weight:900;white-space:nowrap}.brand b{color:var(--yellow)}.tab{padding:9px 15px;background:var(--yellow);color:#17213b;border-radius:7px;font-weight:800}.meta{margin-left:auto;text-align:right;font-size:12px;color:#c9d6ec}.layout{flex:1;min-height:0;display:grid;grid-template-columns:64px minmax(210px,28%) minmax(240px,32%) minmax(280px,1fr);gap:5px;padding:8px}.rail{display:flex;flex-direction:column;gap:9px;align-items:center;padding-top:12px;background:#152a4b;border-radius:8px}.rail button{width:44px;height:44px;border:0;border-radius:50%;background:#edf3fc;color:#142746;font-size:20px}.rail button.active,.rail button:hover{background:var(--yellow)}.pane{min-height:0;overflow:auto;background:#1d355a;border-radius:7px;padding:5px}.item{display:flex;align-items:center;gap:10px;width:100%;padding:12px;border:0;border-bottom:3px solid #1b3053;background:#2d4d79;color:white;text-align:left;border-radius:5px;margin-bottom:3px;min-height:54px}.item.active,.item:hover{background:var(--yellow);color:#15253c}.item small{display:block;opacity:.7;margin-top:4px}.count{margin-left:auto;background:#ffe332;color:#1a3152;padding:6px;border-radius:7px;font-size:12px}.item.active .count{background:#213b5e;color:white}.preview{display:flex;flex-direction:column;gap:12px;padding:8px}.video{width:100%;aspect-ratio:16/9;background:#081427;border:1px solid #60799c;display:flex;align-items:center;justify-content:center;text-align:center;color:#cad8ee}.epg{flex:1;padding:20px;background:#27466f;border-radius:6px}.muted{color:#bacbe1;font-size:13px}.search{width:100%;padding:12px;border-radius:6px;background:#0e213e;border:1px solid #7089a8;color:white;margin-bottom:8px}.hidden{display:none}@media(max-width:950px){.layout{grid-template-columns:54px 26% 34% 1fr}.rail button{width:38px;height:38px}.brand{font-size:20px}.preview{font-size:12px}}@media(max-width:680px){.layout{grid-template-columns:48px 40% 1fr}.preview{display:none}.meta{display:none}}
</style></head><body><div class="shell"><header><div class="brand">MY <b>IPTV</b></div><span class="tab">Live TV</span><span>Favorites List</span><div class="meta">Current playlist: <strong id="playlist">Demo Playlist</strong><br>www.miptv.me</div></header><main class="layout"><nav class="rail" aria-label="Navigation"><button class="active" title="Live TV" aria-label="Live TV">▦</button><button title="Fullscreen preview" aria-label="Fullscreen preview" id="full">⛶</button><button title="Favorites" aria-label="Favorites" id="fav">♥</button><button title="Search" aria-label="Search" id="searchBtn">⌕</button><button title="Settings" aria-label="Settings">⚙</button></nav><section class="pane" aria-label="Categories" id="categories"></section><section class="pane" aria-label="Channels"><input class="search hidden" id="search" placeholder="Search channels / بحث القنوات"><div id="channels"></div></section><section class="pane preview" aria-label="Player and EPG"><div class="video" id="video">Select a channel to preview<br>Connect an authorized playlist for playback</div><div class="epg"><h3 id="program">Program Guide</h3><p class="muted">EPG appears when supplied by the playlist.</p></div></section></main></div>
<script>
const groups=[{name:'Favorites List',channels:[{name:'AR:Aljazeera',num:'1693'},{name:'AR:CNBC_Arabiya',num:'1041'}]},{name:'BEIN SPORTS HD',channels:[{name:'Sports 1 HD',num:'201'},{name:'Sports 2 HD',num:'202'}]},{name:'BEIN SPORTS 4K',channels:[{name:'Sports 4K',num:'301'}]},{name:'Arabic Channels',channels:[{name:'AR:Alarabiya',num:'1028'},{name:'AR:Aljadeed',num:'1223'},{name:'AR:LBC_HD',num:'1238'},{name:'AR:MTV',num:'1246'}]},{name:'Entertainment',channels:[{name:'Entertainment 1',num:'401'}]}];let selected=0,channel=null,onlyFav=false;const $=id=>document.getElementById(id);
function draw(){ $('categories').innerHTML='';groups.forEach((g,i)=>{const b=document.createElement('button');b.className='item'+(selected===i?' active':'');b.innerHTML='<span>◈ <strong></strong><small></small></span>';b.querySelector('strong').textContent=g.name;b.querySelector('small').textContent='Total: '+g.channels.length;b.onclick=()=>{selected=i;draw()};$('categories').append(b)});drawChannels()}
function drawChannels(){const q=$('search').value.toLowerCase();$('channels').innerHTML='';groups[selected].channels.filter(c=>c.name.toLowerCase().includes(q)).forEach(c=>{const b=document.createElement('button');b.className='item'+(channel===c?' active':'');const name=document.createElement('span');name.textContent='▣  '+c.name;const num=document.createElement('span');num.className='count';num.textContent=c.num;b.append(name,num);b.onclick=()=>{channel=c;$('video').textContent=c.name+' — Preview requires a configured stream URL';$('program').textContent=c.name;drawChannels()};$('channels').append(b)})}
$('searchBtn').onclick=()=>{$('search').classList.toggle('hidden');$('search').focus()};$('search').oninput=drawChannels;$('fav').onclick=()=>{selected=0;draw()};$('full').onclick=()=>{if($('video').requestFullscreen)$('video').requestFullscreen()};draw();
</script></body></html>
