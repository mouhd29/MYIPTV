name: Build MY IPTV Branded Fire TV APK
on:
  push:
    branches: [main, firetv-landscape]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract branded Android project
        run: |
          mkdir -p extracted
          unzip -q MYiptv-Branded-Android-Source.zip -d extracted
          PROJECT=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -1)
          test -n "$PROJECT" || { echo "Gradle project missing"; exit 1; }
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Apply landscape TV source
        run: cp -R tv/. "$PROJECT_DIR/"
      - name: Compile branded APK
        run: |
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew testDebugUnitTest assembleDebug --no-daemon; else gradle testDebugUnitTest assembleDebug --no-daemon; fi
      - name: Prepare APK
        run: |
          APK=$(find "$PROJECT_DIR" -path '*/build/outputs/apk/debug/*.apk' -type f | head -1)
          test -n "$APK" || exit 1
          cp "$APK" MYiptv-FireTV-Beta.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MYiptv-FireTV-Beta
          path: MYiptv-FireTV-Beta.apk
      - name: Publish beta APK
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/firetv-landscape')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref == 'refs/heads/main' && 'beta-latest' || 'firetv-v0.6.0' }}
          target_commitish: ${{ github.sha }}
          name: MY IPTV Playlists and Continue Watching Beta 0.6.0
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: MYiptv-FireTV-Beta.apk
